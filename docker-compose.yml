version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/checklistti
      DB_USER: tecnico
      DB_PASS: senha123
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: checklistti
      POSTGRES_USER: tecnico
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecnico -d checklistti"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
